{% extends 'base.html' %}
{% block title %}Report a Problem{% endblock %}
{% block content %}
<div class="container py-5"><div class="glass-panel p-4 mx-auto" style="max-width:760px"><h1>Report a Problem</h1><p class="text-muted">Report. Track. Resolve.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude"><input class="form-control mb-3" name="title" placeholder="Problem title" required><select class="form-select mb-3" name="category">{% for category in categories %}<option>{{ category }}</option>{% endfor %}</select>
<div class="d-flex gap-2 align-items-center mb-2"><label class="form-label mb-0">Describe the problem</label><select id="speechLanguage" class="form-select form-select-sm" style="max-width:130px"><option value="en-IN">English</option><option value="hi-IN">हिन्दी</option><option value="mr-IN">मराठी</option></select><button type="button" id="problemMic" class="btn btn-secondary-neu btn-sm"><i class="bi bi-mic"></i> Speak</button></div><textarea class="form-control mb-3" id="problemDescription" name="description" rows="6" placeholder="Type or speak the problem. You can edit the transcript." required></textarea><small id="speechStatus" class="text-muted d-block mb-3">Voice adds to your description; it does not submit automatically.</small>
<div class="d-flex gap-2 align-items-center mb-3"><button type="button" id="useLocation" class="btn btn-secondary-neu"><i class="bi bi-geo-alt"></i> Use current location</button><span id="locationStatus" class="small text-muted"></span></div><input class="form-control mb-3" name="address" id="address" placeholder="Full address or landmark"><div class="row"><div class="col"><input class="form-control mb-3" name="city" id="city" placeholder="City"></div><div class="col"><input class="form-control mb-3" name="state" id="state" placeholder="State"></div><div class="col"><input class="form-control mb-3" name="pincode" placeholder="Pincode"></div></div><select class="form-select mb-3" name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select><button class="btn btn-primary-neu">Submit Complaint</button></form></div></div>
<script>(()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition,b=document.getElementById('problemMic'),d=document.getElementById('problemDescription'),s=document.getElementById('speechStatus'),l=document.getElementById('speechLanguage');if(!R){b.disabled=true;s.textContent='Voice input is not supported; type manually.';return}let r,base='';b.onclick=()=>{if(r){r.stop();return}base=d.value.trim();r=new R();r.lang=l.value;r.continuous=true;r.interimResults=true;r.onstart=()=>{b.innerHTML='Stop';s.textContent='Listening… speak naturally.'};r.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const t=e.results[n][0].transcript;if(e.results[n].isFinal)f+=t;else i+=t}if(f)base=(base+' '+f).trim();d.value=(base+' '+i).trim()};r.onerror=e=>s.textContent='Microphone error ('+e.error+'). Check permission or type manually.';r.onend=()=>{r=null;b.innerHTML='<i class="bi bi-mic"></i> Speak';s.textContent='Transcript ready — review before submitting.'};r.start()}})();document.getElementById('useLocation').onclick=()=>{const s=document.getElementById('locationStatus');if(!navigator.geolocation){s.textContent='Location unavailable; enter address manually.';return}s.textContent='Requesting permission…';navigator.geolocation.getCurrentPosition(async p=>{document.getElementById('latitude').value=p.coords.latitude;document.getElementById('longitude').value=p.coords.longitude;s.textContent='Location captured.';try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p.coords.latitude}&lon=${p.coords.longitude}`);const x=await r.json(),a=x.address||{};document.getElementById('address').value=document.getElementById('address').value||x.display_name||'';document.getElementById('city').value=document.getElementById('city').value||a.city||a.town||a.village||'';document.getElementById('state').value=document.getElementById('state').value||a.state||''}catch(e){}},()=>s.textContent='Permission denied; enter address manually.')};</script>
<script>document.querySelector('form').setAttribute('enctype','multipart/form-data');const p=document.createElement('div');p.className='mb-3';p.innerHTML='<label class="form-label" for="evidence">Upload Evidence</label><input class="form-control" id="evidence" name="evidence" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,video/mp4"><small class="text-muted">Add a photo, video, or PDF evidence.</small>';document.querySelector('select[name="priority"]').before(p);</script>
{% endblock %}
