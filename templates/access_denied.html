{% extends "base.html" %}
{% set hide_sidebar = true %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="auth-shell text-center">
  <div class="surface-card auth-card p-5" style="max-width:480px;margin:0 auto">
    <i class="bi bi-shield-x display-4 text-danger mb-3"></i>
    <h1>Access denied</h1>
    <p class="text-muted mb-4">You do not have permission to view this area.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary me-2">Citizen login</a>
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Home</a>
  </div>
</div>
{% endblock %}
