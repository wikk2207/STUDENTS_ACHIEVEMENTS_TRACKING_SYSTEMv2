<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Starter</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #e6e6fa 0%, #ddd6fe 45%, #e9d5ff 70%, #f5f3ff 100%);
      color: #3d2c54;
      min-height: 100vh;
    }
    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #f7f4fa;
      box-shadow: 2px 0 16px rgba(124,58,237,0.07);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .profile img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 0.5rem;
    }
    .profile .name {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 0.2rem;
    }
    .sidebar nav {
      width: 100%;
    }
    .sidebar nav a {
      display: block;
      padding: 0.7rem 1rem;
      margin: 0.2rem 0;
      border-radius: 12px;
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .sidebar nav a.active, .sidebar nav a:hover {
      background: #e6e6fa;
    }
    .main {
      flex: 1;
      padding: 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dashboard-header .greeting {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .dashboard-header .search {
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px solid #e0d7f3;
      font-size: 1rem;
      outline: none;
      background: #fff;
      min-width: 220px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(124,58,237,0.07);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .circular {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f7f4fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #7c3aed;
      margin: 0 auto 0.5rem auto;
      border: 6px solid #e6e6fa;
      box-shadow: 0 2px 8px rgba(124,58,237,0.07);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="profile">
        <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile">
        <div class="name">Sophia Tompson</div>
        <div class="role">Student</div>
      </div>
      <nav>
        <a href="#" class="active">Dashboard</a>
        <a href="#">My Classes</a>
        <a href="#">My Grades</a>
        <a href="#">Schedule</a>
        <a href="#">Messages</a>
        <a href="#">Settings</a>
        <a href="#" style="margin-top:2rem;color:#e57373;">Log out</a>
      </nav>
    </aside>
    <main class="main">
      <div class="dashboard-header">
        <div class="greeting">Hello, Sophia!</div>
        <input class="search" type="text" placeholder="Search...">
      </div>
      <div class="cards">
        <div class="card">
          <div class="card-title">Attendance</div>
          <div class="circular">60%</div>
        </div>
        <div class="card">
          <div class="card-title">Homework</div>
          <div class="circular">90%</div>
        </div>
        <div class="card">
          <div class="card-title">Rating</div>
          <div class="circular">75%</div>
        </div>
        <div class="card">
          <div class="card-title">Upcoming Events</div>
          <ul>
            <li>Robotics lesson - May 18</li>
            <li>Electronics lesson - May 19</li>
            <li>IoT lesson - May 20</li>
          </ul>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
